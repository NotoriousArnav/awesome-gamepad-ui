[package]
name = "awesome-gamepad-ui"
version = "0.1.0"
description = "A couch-first, gamepad-driven game launcher"
authors = ["you"]
license = "GPL-3.0-or-later"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "awesome_gamepad_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-gamepad = "0.0.6"
# Timestamped log filenames (local time), already present in the dependency graph.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Used for a startup snapshot of connected pads; same version the gamepad plugin
# links against, so it stays a single shared copy.
gilrs = "0.11"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
