name: Bug report
description: Something isn't working
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill in as much
        as you can — controller and display details really help.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '…'
        2. Press '…'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Release version, or the output of `git rev-parse --short HEAD`.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - Windows
        - macOS
        - Other
    validations:
      required: true
  - type: input
    id: controller
    attributes:
      label: Controller
      description: e.g. Xbox Series, DualSense, 8BitDo Pro 2, or "keyboard"
    validations:
      required: false
  - type: input
    id: display
    attributes:
      label: Display / resolution
      description: e.g. 1080p TV, 4K monitor, 3440x1440 ultrawide
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste logs here. Remove any API keys first.
      render: shell
    validations:
      required: false
